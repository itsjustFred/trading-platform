name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to a PR supersedes the run still in flight for that PR; every
  # non-PR event gets a group keyed on its own run id, because GitHub keeps
  # only one pending run per group and would otherwise drop a queued main
  # push or dispatch. Every merged commit keeps its verdict (#297).
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same uv pin the pip install carried; setup-uv also restores the uv
      # cache, which is where `uv sync --frozen` spends its time (#297).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Validate lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --no-install-project --no-build
      - name: Validate generated requirements
        run: uv run --no-sync --no-build python scripts/check_requirements_drift.py
      - name: Lint packaging and import seams
        if: runner.os == 'Linux'
        # The seam list lives in ruff-seams.toml, which extends pyproject's
        # lint config so this blocking run cannot drift from the advisory
        # `ruff check .` below (#297).
        run: uv run --no-sync --no-build ruff check --config ruff-seams.toml .
      - name: Lint (advisory)
        continue-on-error: true
        run: uv run --no-sync --no-build ruff check .
      - name: Lint (bug-class families, blocking)
        if: runner.os == 'Linux'
        # `ruff check .` above is advisory because main carries an E501 backlog,
        # so it can never fail on the families this change drove to zero: a new
        # B/DTZ/PERF/... hit would land inside a green build. This step selects
        # exactly the families pyproject.toml enabled and pins them at zero.
        # Keep the list in sync with [tool.ruff.lint].select; the
        # `tests/test_lint_family_ratchet.py` test asserts the two agree.
        run: >-
          uv run --no-sync --no-build ruff check --select
          B,DTZ,PERF,PLE,PLW0120,PLW0602,PLW1510,RUF005,RUF006,RUF007,RUF012,RUF013,RUF015,RUF019,RUF021,RUF023,RUF036,RUF043,RUF046,RUF059,S307 .
      - name: Type check (mypy)
        if: runner.os == 'Linux'
        # mypy is a dev dependency (`uv sync` installs it) and pinned there to
        # 2.4.1, so this is the same interpreter the developer gets from
        # `uv sync --frozen --extra dev && uv run mypy` (AGENTS.md): no --with
        # overlay, no second copy of the type-checker, and a version bump is one
        # lock change.
        run: uv run --no-sync --no-build mypy
      - name: Tests
        if: runner.os == 'Linux'
        run: >-
          uv run --no-sync --no-build pytest -q -p no:cacheprovider -m "not slow"
          --ignore=tests/strategies
      - name: Strategy tests
        if: runner.os == 'Linux'
        # Mostly dataset-gated skips today (#289); kept so a change that makes
        # them runnable cannot land without the step existing to run them.
        run: uv run --no-sync --no-build pytest -q -p no:cacheprovider tests/strategies
      - name: Harness gates
        if: runner.os == 'Linux'
        run: |
          PYTHON="$(uv run --no-sync --no-build python -c 'import sys; print(sys.executable)')" \
            bash scripts/gate-tests.sh
      - name: Build wheel
        run: uv build --wheel --out-dir dist --no-create-gitignore
      - name: Wheel and import smoke
        run: uv run --no-sync --no-build python scripts/wheel_smoke.py

  frontend:
    name: Frontend focused checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Frontend focused test lint
        run: >-
          ./node_modules/.bin/eslint
          tests/frontendResilience.test.ts
          tests/liveTerminal.test.ts
          tests/optimizationEvidence.test.ts
          tests/compareStats.test.ts
          tests/livePositionMath.test.ts
          tests/backtestListMetrics.test.ts
      - name: Frontend focused tests
        run: npm run test:focused
      - name: Frontend TypeScript and production build
        run: npm run build
