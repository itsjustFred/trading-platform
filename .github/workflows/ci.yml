name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to a PR supersedes the run still in flight for that PR; every
  # non-PR event gets a group keyed on its own run id, because GitHub keeps
  # only one pending run per group and would otherwise drop a queued main
  # push or dispatch. Every merged commit keeps its verdict (#297).
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The differential real-data slice is downloaded, not committed (see
      # scripts/fetch_differential_slice.py). Pointing the tests at a cached path
      # keeps the scenario from depending on the working directory of the step
      # that reads it. On pull requests REQUIRE_REAL_DATA_SLICE is set on the
      # test step only when the fetch succeeded, so a Dukascopy outage warns and
      # skips the real-data scenarios instead of failing the job; on push to
      # main the fetch step itself fails on a download error, so the slice is
      # always required there and a permanent outage is noticed. A present
      # malformed slice still fails inside the tests either way.
      DIFFERENTIAL_REAL_SLICE_CSV: ${{ github.workspace }}/.cache/differential/eurusd_15m_slice.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same uv pin the pip install carried; setup-uv also restores the uv
      # cache, which is where `uv sync --frozen` spends its time (#297).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Validate lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --no-install-project --no-build
      - name: Validate generated requirements
        run: uv run --no-sync --no-build python scripts/check_requirements_drift.py
      - name: Lint packaging and import seams
        # The seam list lives in ruff-seams.toml, which extends pyproject's
        # lint config so this blocking run cannot drift from the advisory
        # `ruff check .` below (#297).
        run: uv run --no-sync --no-build ruff check --config ruff-seams.toml .
      - name: Lint (advisory)
        continue-on-error: true
        run: uv run --no-sync --no-build ruff check .
      - name: Lint (bug-class families, blocking)
        # `ruff check .` above is advisory because main carries an E501 backlog,
        # so it can never fail on the families this change drove to zero: a new
        # B/DTZ/PERF/... hit would land inside a green build. This step selects
        # exactly the families pyproject.toml enabled and pins them at zero.
        # Keep the list in sync with [tool.ruff.lint].select; the
        # `tests/test_lint_family_ratchet.py` test asserts the two agree.
        run: >-
          uv run --no-sync --no-build ruff check --select
          B,DTZ,PERF,PLE,PLW0120,PLW0602,PLW1510,RUF005,RUF006,RUF007,RUF012,RUF013,RUF015,RUF019,RUF021,RUF023,RUF036,RUF043,RUF046,RUF059,S307,PLC2701 .
      - name: Type check (mypy)
        # mypy is a dev dependency (`uv sync` installs it) and pinned there to
        # 2.4.1, so this is the same interpreter the developer gets from
        # `uv sync --frozen --all-extras && uv run mypy` (AGENTS.md): no --with
        # overlay, no second copy of the type-checker, and a version bump is one
        # lock change.
        run: uv run --no-sync --no-build mypy
      - name: Restore the differential real-data slice
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/differential/eurusd_15m_slice.csv
          # The key hashes the fetch script and the whole data_tools package: the window,
          # schema and validation (differential_slice.py), the 1m parse (downloaders/),
          # and the 15m resample rules (resample.py). A change to any of them must
          # regenerate the slice, not reuse one built under the old rules. A hit means
          # the download below is skipped entirely, so the network is touched rarely.
          key: differential-slice-${{ hashFiles('scripts/fetch_differential_slice.py', 'data_tools/**/*.py') }}
      - name: Fetch the differential real-data slice
        id: fetch-slice
        shell: bash
        run: |
          set +e
          uv run --no-sync --no-build python -m scripts.fetch_differential_slice --skip-if-valid
          status=$?
          set -e
          # Exit 3 is a download failure with no usable cache. On pull requests
          # (and workflow_dispatch) that warns and skips the real-data tests;
          # on push to main the slice is required, so the step - and the job -
          # fails instead.
          if [ "$status" -eq 3 ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "::warning::Dukascopy real-data slice download failed; the differential real-data tests will skip."
            echo "download_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
      - name: Tests
        env:
          REQUIRE_REAL_DATA_SLICE: ${{ steps.fetch-slice.outputs.download_failed == 'true' && '0' || '1' }}
        run: >-
          uv run --no-sync --no-build pytest -q -p no:cacheprovider -m "not slow"
          --ignore=tests/strategies --junitxml=pytest-junit.xml
      - name: Strategy tests
        # Mostly dataset-gated skips today (#289); kept so a change that makes
        # them runnable cannot land without the step existing to run them.
        run: uv run --no-sync --no-build pytest -q -p no:cacheprovider tests/strategies --junitxml=strategy-junit.xml
      - name: Skip report
        if: runner.os == 'Linux'
        # Makes visible what CI never runs: skips grouped by reason in the job
        # summary, and a failure when a money-path test skips for a reason that
        # is not an allowed dataset gate (#289 tracks closing those gates).
        run: >-
          uv run --no-sync --no-build python scripts/ci/skip_report.py
          pytest-junit.xml strategy-junit.xml
      - name: Harness gates
        run: |
          PYTHON="$(uv run --no-sync --no-build python -c 'import sys; print(sys.executable)')" \
            bash scripts/gate-tests.sh
      - name: Build wheel
        run: uv build --wheel --out-dir dist --no-create-gitignore
      - name: Wheel and import smoke
        run: uv run --no-sync --no-build python scripts/wheel_smoke.py

  frontend:
    name: Frontend focused checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Frontend test lint
        run: ./node_modules/.bin/eslint tests/
      - name: Frontend focused tests
        run: npm run test:focused
      - name: Frontend TypeScript and production build
        run: npm run build

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The agent workflows are ~1500 lines of YAML whose failure mode is a
      # silent misroute (a skipped `if:`, a drifted reusable-call input), so
      # they get a real linter, not just the contract tests. The binary is
      # pinned by release version and verified against the published sha256,
      # like gitleaks in secret-scan.yml.
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --proto-redir '=https' -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version
      - name: Lint workflows
        run: ./actionlint
