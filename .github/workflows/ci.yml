name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: "python -m pip install --only-binary=:all: uv==0.10.4"
      - name: Validate lockfile
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --no-install-project --no-build
      - name: Validate generated requirements
        run: uv run --no-sync --no-build python scripts/check_requirements_drift.py
      - name: Lint packaging and import seams
        if: runner.os == 'Linux'
        run: >-
          uv run --no-sync --no-build ruff check
          live_runner/__init__.py
          live_runner/account_discovery.py
          live_runner/ctrader_adapter.py
          scripts/sync_requirements_from_lock.py
          scripts/check_requirements_drift.py
          scripts/matrix_queue_runner.py
          scripts/verify_ctrader_order.py
          scripts/wheel_smoke.py
          tests/test_packaging.py
      - name: Lint (advisory)
        continue-on-error: true
        run: uv run --no-sync --no-build ruff check .
      - name: Tests
        if: runner.os == 'Linux'
        run: >-
          uv run --no-sync --no-build pytest -q -p no:cacheprovider -m "not slow"
          --ignore=tests/strategies
      - name: Strategy tests
        if: runner.os == 'Linux'
        run: uv run --no-sync --no-build pytest -q -p no:cacheprovider tests/strategies
      - name: Harness gates
        if: runner.os == 'Linux'
        run: |
          PYTHON="$(uv run --no-sync --no-build python -c 'import sys; print(sys.executable)')" \
            bash scripts/gate-tests.sh
      - name: Build wheel
        run: uv build --wheel --out-dir dist --no-create-gitignore
      - name: Wheel and import smoke
        run: uv run --no-sync --no-build python scripts/wheel_smoke.py

  frontend:
    name: Frontend focused checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Frontend focused test lint
        run: >-
          ./node_modules/.bin/eslint
          tests/frontendResilience.test.ts
          tests/liveTerminal.test.ts
          tests/optimizationEvidence.test.ts
          tests/compareStats.test.ts
          tests/backtestListMetrics.test.ts
      - name: Frontend focused tests
        run: npm run test:focused
      - name: Frontend TypeScript and production build
        run: npm run build
