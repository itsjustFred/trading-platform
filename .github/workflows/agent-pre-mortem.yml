name: Agent Pre-Mortem
# Quoted: an unquoted "#" after a space starts a YAML comment, which dropped
# the PR number and SHA from display_title.
run-name: "Agent Pre-Mortem PR #${{ github.event.pull_request.number || github.event.inputs.pr_number }} @ ${{ github.event.pull_request.head.sha || github.event.inputs.head_sha || 'current head' }}"

# Our own automated, read-only pre-mortem on every push to a PR, using the
# `.agents/skills/actions-pre-mortem` skill as the system prompt of an opencode
# agent. It is one of three independent agent workflows (Agent Code Review,
# Agent Mutation Testing, Agent Pre-Mortem) that each run on their own on every
# push to an open PR: none of them starts another, and each upserts one PR
# comment of its own. SonarCloud runs separately on each push as well; the
# `platform-pr-verify` skill reads the four together. (The earlier chain, where
# review -> mutation -> pre-mortem ran one after the other via dispatches, is
# abandoned.)
#
# It runs on `pull_request` itself (opened, a synchronize, a reopen, the moment a
# draft becomes ready for review, and a base retarget), with a `workflow_dispatch`
# for a manual rerun of a PR (`pr_number`, and `head_sha` when an older commit has
# to be re-analysed, e.g. after an infra failure). Its run-name carries the PR
# number and the analysed SHA, so a run of an older commit is recognisable in the
# run list.
#
# `edited` is subscribed for the retarget and nothing else: a retarget changes
# base...head, so the diff the last verdict covered no longer exists, and GitHub
# fires no other action for it (a base branch that advances on the PR's behalf
# does not fire anything at all, which is a limitation of the event, not of this
# step). A title, body or label edit fires the same action, and re-analysing for it
# would spend model quota on a verdict that is already current, so the run is
# skipped unless the event carries a changed base - see the guard on the resolve
# job. The concurrency group below is keyed by that analysed SHA, so a
# re-dispatch of an older commit runs *beside* the current head's run instead of
# cancelling it - a rerun of the same commit still supersedes its own stale run.
#
# The agent is read-only; this job writes no repo code. It reads the PR diff and
# its blast radius, writes ranked future-failure scenarios, and produces a
# machine-checkable verdict. For the analysed SHA the workflow sets the commit
# status `agent/pre-mortem`, advisory by decision of 2026-11-20: `pending` while
# running, `success` for every verdict - PASS, BLOCK and CHANGES-REQUESTED
# alike - with the verdict named in the description, and `error` for INCOMPLETE
# or for a failed run. No verdict reports `failure`: the pre-mortem ranks what
# could break later and a human decides what to harden, so a red status on the
# commit a PR is built on would block a merge over a judgement the status cannot
# carry. The ranked scenarios stay in the comment, and the verdict is still the
# first thing the status description says. It also upserts one PR comment titled
# `# Pre-Mortem Action` (hidden marker `<!-- actions-pre-mortem -->`). A result
# for a commit that is no longer the PR head still lands its status on its own
# SHA but does not overwrite the comment.
#
# Every result it writes names the diff it was computed against: the comment's
# footer and every terminal status description carry the analysed base and head,
# short so they fit, and a description whose run never learned the base (a
# cancelled resolve, or a dispatch) names the head alone rather than an empty
# " on base ". The one status that names no diff is the `pending` mark "Mark
# running" writes before there is a result: it links the run computing it instead,
# which is the same thing at that point. A verdict is only current for its
# base...head pair, and both can move
# under it - a retarget (the trigger above), a base branch that advanced, or a
# head that moved past the commit this run analysed - so a reader has to be able
# to tell a stale verdict from the current one without opening the run log.
#
# The pending-to-error conversions the stop paths make are a read-then-write: the
# commit status API has no conditional write. They are pinned down as far as the
# API allows and their residual window is stated rather than denied - see the
# comments on the reporters themselves.
#
# opencode's free Zen models (and Kilo's, see Configuration) need no login and
# no API key, so this workflow holds no secret besides the default GITHUB_TOKEN
# (and, only for an `nvidia/...` model, ACTIONS_NVIDIA_API_KEY - see Configuration)
# of the jobs that run no repo code. Those models do cap usage, and an exhausted cap must not read as a
# pre-mortem result: the shared `agent-quota-probe` workflow pings the same
# model before the agent job installs anything, and a cap, rate limit or region
# refusal there skips the agent job - a grey check, not a red one - while the
# post job comments "not run: quota" and warns (decision of 2026-11-21, issue
# #296). The probe's reply is logged on every path, its quota signature is
# grepped over stdout and stderr whatever the exit status (opencode has been
# seen exiting 0 on the cap for this tiny prompt), and `available=true` is only
# claimed when the reply actually carries the OK token - every other outcome
# fails open so a genuine failure still fails.
#
# The honest limit of the probe: it is a one-word ping, and a cap that is a
# token budget can still pass it - the ping fits under a ceiling the real run
# does not. Then the mid-run path below is the usual one: the agent step
# reports the skip instead of failing, the run's check is green (a job that
# ran cannot show skipped), the comment says "not run: quota" and the pending
# mark it wrote is rewritten to say so rather than `error`. Grey is only
# reachable on the pre-install skip; once the agent job has run, green-with-
# the-skip-commented is the answer the API allows.
# Anything the probe cannot classify as quota still runs the agent job, so a
# genuine failure - a broken install, a misconfigured model, a crashed agent -
# still fails the run and is reported as `error`, like any other transient
# reason a sibling has (re-run the job; the remedy is the one the siblings
# document).
#
# Trust model:
# - The rules (the skill) are read from the base branch, so a PR cannot weaken
#   its own run. Only while the base has no skill yet is another copy used, and
#   the prompt says so.
# - The agent is defined in the runner's global opencode config, outside the
#   checkout. Its edit tool and .env reads are denied, but it has a shell, so
#   those denies are a hint, not a boundary. The real guards: the agent job
#   holds no token or secret, and the run fails if HEAD moved or the tree is
#   dirty.
# - This workflow file itself is not pinned: on pull_request GitHub runs the
#   PR's copy. Accepted, since only collaborators with write access can open
#   same-repo PRs. Fork PRs are skipped, and drafts (the run is skipped until
#   the PR is ready for review).
#
# Manual rerun (a failed or superseded run, or an older commit that never got
# one): pass the head SHA as well as the PR number when the analysed commit is
# not the current head; the comment guard then keeps a newer result in place. The
# SHA must be a full 40-hex SHA that is one of that PR's own commits - a typo or
# another PR's head is refused, so no foreign diff is ever analysed under this
# PR's name - and the *current* head is refused too: its bucket is named after
# the commit, so it would run beside the push analysing that same diff instead of
# superseding it. Re-running the current head is `-f pr_number=<N>` alone:
#   gh workflow run agent-pre-mortem.yml --ref <pr-branch> -f pr_number=<N>
# and re-analysing an older commit of this PR - the case a dispatch exists for -
# is the same command with that commit's SHA, which is what keeps it in a bucket
# of its own beside the current head's run:
#   gh workflow run agent-pre-mortem.yml --ref <pr-branch> -f pr_number=<N> -f head_sha=<head-sha>
# A dispatch can only name a ref that carries this workflow file. This PR is the
# one that adds it, so until it merges into the default branch the manual rerun is
# not reachable and a push is the only re-run - every push re-analyses the new
# head, which is the normal path anyway. After the merge the commands above work
# from any branch.
#
# The step bodies live in `scripts/agents/` (install_opencode.sh,
# select_skill.sh, configure_agent.sh, run_agent.sh, quota_comment.py,
# post_comment.py, parse_verdict.py) so all three agent workflows share one
# tested copy; this file is only the stage-specific wiring.
#
# Configuration (Settings -> Secrets and variables -> Actions -> Variables):
#   PREMORTEM_MODEL    opencode model, provider/model (default: opencode/inkling-2-small-free)
#   PREMORTEM_VARIANT  reasoning variant offered by that model, e.g. low/high/max (default: max)
#
# A `kilo/<model>` value (e.g. kilo/reflection/beam-free) runs the stage on Kilo's
# anonymous gateway instead of Zen: no key either, but a separate quota. The config
# steps then enable opencode's built-in `kilo` provider. Kilo caps anonymous use per
# IP ("Sign up for free to continue") and rate-limits busy free models upstream
# (opencode retries those, then ends on "Provider returned error"); both take the
# quota path like a Zen cap. Kilo's free models may train on prompts - this
# repository is public. Variants are per model and not always the ones Kilo lists:
# opencode 2.2.7 refused Ling 3.2 Flash's `thinking` and took `high`.
#
# A `nvidia/<model>` value (e.g. nvidia/stepfun-ai/step-5-preview) runs the stage on
# NVIDIA's API with the ACTIONS_NVIDIA_API_KEY repository secret. Only the probe step
# and the agent step receive it, and only for an `nvidia/...` model; every other model
# runs with no secret, as before. The agent has a shell, so the key is reachable from
# the agent's environment: accepted for a free-tier key on same-repo PRs (forks are
# skipped and get no secrets). NVIDIA's free tier limits per key, not per IP, and the
# key is shared with local use. A 429 ("Too Many Requests") takes the quota path
# like a Zen cap - grey when the probe sees it, "not run: quota" when it hits mid-run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the open PR to pre-mortem
        required: true
        type: number
      head_sha:
        description: Commit to analyse; the result lands on this commit, and a newer head's comment is not overwritten (default the current head)
        required: false
        type: string

concurrency:
  # A rerun of an older commit (`-f head_sha=<old-sha>`) must not cancel the run that
  # is analysing the current head - that run's cancellation reporter would mark the
  # head `error` and leave it with no analysis at all - so such a rerun keeps a
  # bucket of its own. A rerun naming the same commit does cancel a stale run of
  # that commit; a rerun that omits `head_sha` shares the `current-head` bucket
  # with the push's run, so it supersedes it instead of running a second analysis
  # of the same diff beside it (the comment guard keeps whichever result lands
  # last).
  #
  # The bucket carries an analysed commit only when a *dispatch* names one. A push
  # must not carry its head SHA here: every push would then land in a group of its
  # own, so N pushes on one PR would run N 30-minute agent sessions side by side
  # and exhaust the free model's usage cap, after which the stage stops producing
  # a verdict for any PR at all. Keyed on the PR, pushes supersede one another and
  # only the current head's analysis survives - which is the one the PR actually
  # needs - while a dispatch of an older commit keeps its own bucket and still runs
  # beside the push's run, which is the case the whole keying exists for.
  #
  # An `edited` event that changes no base - a title, body or label edit - is a bucket
  # of its own, named after this run. Its resolve job is skipped (the guard below),
  # so joining the bucket of the analysis it would cancel leaves that analysis
  # cancelled with no replacement: the verdict is never posted and the stage stays
  # `pending` until the next push. Handing the run its own bucket cannot cancel the
  # running analysis, and a retarget - which *does* re-analyse - still joins
  # `current-head` and supersedes it, because that is exactly what it invalidates.
  group: agent-pre-mortem-${{ github.event.pull_request.number || github.event.inputs.pr_number }}-${{ inputs.head_sha || (github.event.action == 'edited' && !github.event.changes.base && format('edited-{0}', github.run_id)) || 'current-head' }}
  cancel-in-progress: true

env:
  # Pinned, and the extraction the shared run_agent.sh is written against this
  # pin: `opencode run --standalone --archived` is expected to print the assistant
  # messages, the report to start at a column-0 `**Summary:**` line and to end
  # with the verdict on its last non-empty line. A release that prefixes the
  # streamed lines, prints reasoning or reorders the messages breaks all three,
  # and every PR's stage then fails closed with "does not end with a valid
  # verdict line" until a human reads a log. So a bump means reading the
  # extraction against the new version's output before it lands, not after.
  OPENCODE_VERSION: "2.2.7"
  MODEL: ${{ vars.PREMORTEM_MODEL || 'opencode/inkling-2-small-free' }}
  VARIANT: ${{ vars.PREMORTEM_VARIANT || 'max' }}
  SKILL_PATH: .agents/skills/actions-pre-mortem/SKILL.md
  PREMORTEM_CONTEXT: agent/pre-mortem

# The default token scopes, narrowed once for the whole workflow. A job with its own
# `permissions:` block replaces this one (it does not add to it), so this is only the default for
# a job that declares none - and without it every job runs on the repository's default scopes,
# which are whatever Actions is set to grant and not what this workflow needs. No job here needs
# more than reading the repository: the agent job reads the checkout, resolve reads the PR and
# writes one status, post writes one comment and one status, the cancellation reporter writes one
# status, and each of those three declares exactly the scope it uses.
permissions:
  contents: read

jobs:
  # Resolves the PR and writes its metadata (title and body via jq, never via
  # ${{ }} interpolation into a shell script). On pull_request the event payload
  # is enough, so the usual path makes no API call and uses no token; the
  # dispatch path resolves the PR number with the token. Skips drafts. It marks
  # nothing: the `pending` status is written by the agent job itself, once the
  # quota probe has cleared it to run - a run skipped for quota must leave no
  # `pending` behind, and a resolve failure strands none because none exists yet.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A manual rerun resolves the PR by number; the pull_request path parses
    # the event payload and needs no API call. The token writes the status
    # below, and only for a same-repo PR.
    permissions:
      # `contents: read` reads the PR's commit list, which the head_sha check
      # below needs; this job writes no status - the pending mark is the agent
      # job's, written only once the run is cleared to happen.
      pull-requests: read
      contents: read
    # Drafts are not pre-mortemed: the run resumes when the PR is ready for
    # review (one of the pull_request types above). Of the `edited` action only a
    # base retarget re-runs the stage - `changes.base` is present exactly when the
    # event changed the base - so a title, body or label edit, which fires the same
    # action, is skipped. The shape inside `changes.base` is deliberately not read:
    # GitHub fills `ref`/`sha` differently between retargets, and presence alone is
    # what the skip needs. A skipped resolve skips every job that needs its outputs.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.base)) }}
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          head=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            jq '.pull_request' "$GITHUB_EVENT_PATH" > pr.json
          else
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR}" > pr.json
            if [ "$(jq -r .state pr.json)" != "open" ]; then
              echo "::error::PR #${INPUT_PR} is not open."
              exit 1
            fi
            # A dispatch is the only path that reaches what a push never opens: a fork PR, which
            # is never pre-mortemed (its head commit is not one this repository can write a status
            # for, and its comment belongs to no branch here), or one still a draft. Refusing
            # either is what keeps a run from going green while grading nothing: the skip for them
            # is implicit on the other paths - `same_repo` skips the agent and post jobs, and a
            # draft never fires at all - so an explicit request that is silently skipped reads as
            # "no findings" to the operator who asked for it.
            if [ "$(jq -r .head.repo.full_name pr.json)" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::PR #${INPUT_PR} is a fork PR; fork PRs are not pre-mortemed. Push a branch to this repository to have it analysed."
              exit 1
            fi
            if [ "$(jq -r .draft pr.json)" = "true" ]; then
              echo "::error::PR #${INPUT_PR} is still a draft; it is pre-mortemed when it is ready for review."
              exit 1
            fi
            # A dispatch may name an older commit (a rerun after an infra
            # failure, or one the head moved past). It is analysed on purpose:
            # its status lands on that commit, and the comment guard below
            # keeps a newer result's comment in place. What it may not name is a
            # commit this PR does not contain: that would post a pre-mortem of a
            # foreign diff on this PR, and would put a verdict on another PR's
            # gate. So the input is checked, and a check that cannot be made
            # refuses the run rather than analysing whatever was typed.
            if [ -n "$INPUT_SHA" ]; then
              if ! printf '%s' "$INPUT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
                echo "::error::head_sha must be a full 40-character commit SHA (lowercase hex); got '${INPUT_SHA}'."
                exit 1
              fi
              # Only a dispatch may name a commit other than the head, so the
              # head is compared first and the commit list is read only when it
              # has to be. The list is captured before it is matched: under
              # `set -o pipefail` a `grep -q` that matches exits at once and
              # closes the pipe, `gh` then dies of SIGPIPE writing the next page,
              # and the whole pipeline is non-zero - so piping straight into the
              # match refuses a commit this PR does contain. This PR's own
              # documented rerun is exactly that case: an older commit sits on
              # the first page of a commit list that pages at 30.
              head_now=$(jq -r .head.sha pr.json)
              # The bucket a dispatch lands in carries the commit it names, so naming the
              # current head does not share the `current-head` bucket of the push analysing that
              # same diff right now: the rerun would run beside it instead of superseding it, a
              # second 30-minute session on an unchanged diff, and every repetition of the
              # remedy a capped run prints spends the free model's quota for nothing. Omitting
              # head_sha is what re-runs the current head in the bucket that supersedes.
              if [ "$head_now" = "$INPUT_SHA" ]; then
                echo "::error::head_sha ${INPUT_SHA} is the current head of PR #${INPUT_PR}; omit head_sha to re-run it in the bucket that supersedes the push's run, or name an older commit of this PR to analyse it beside them."
                exit 1
              fi
              if [ "$head_now" != "$INPUT_SHA" ]; then
                if ! commits=$(gh api --paginate \
                  "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR}/commits" --jq '.[].sha'); then
                  echo "::error::Could not read the commit list of PR #${INPUT_PR}; refusing to analyse ${INPUT_SHA}."
                  exit 1
                fi
                if ! printf '%s\n' "$commits" | grep -qxF "$INPUT_SHA"; then
                  echo "::error::Commit ${INPUT_SHA} is not a commit of PR #${INPUT_PR}; nothing to analyse."
                  exit 1
                fi
                # Only when the input really is another commit: a rerun that names
                # the current head must not log that it is not the head.
                echo "::notice::PR head is ${head_now}, not ${INPUT_SHA}; analysing the requested commit."
              fi
            fi
          fi
          head=${INPUT_SHA:-$(jq -r .head.sha pr.json)}
          # The metadata names the commit that is analysed, not the PR's current
          # head: a manual rerun of an older commit hands the agent a file that
          # agrees with the prompt instead of a stale SHA.
          jq --arg head "$head" '{number, title, body, base: .base.sha, head: $head}' pr.json > meta.json
          {
            echo "number=$(jq -r .number pr.json)"
            echo "base=$(jq -r .base.sha pr.json)"
            echo "head=${head}"
            echo "same_repo=$(jq -r --arg r "$GITHUB_REPOSITORY" '.head.repo.full_name == $r' pr.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-pre-mortem-meta
          path: meta.json
          retention-days: 1

  # A cheap probe of the free model's quota, run after resolve and before the
  # agent job installs anything: an exhausted cap, a rate limit or a region
  # refusal is an infrastructure state, not a pre-mortem result, so it must not
  # turn the run red. The probe itself is the shared reusable workflow
  # `.github/workflows/agent-quota-probe.yml` - one copy for all three agent
  # workflows. It pings the same model and variant the agent will use; only a
  # positive quota signature - grepped over stdout and stderr, whatever the
  # exit status, because opencode has been seen exiting 0 on the cap for this
  # tiny prompt - reports `available=false`, and `available=true` is only
  # claimed when the reply actually carries the OK token. Everything else - a
  # success without OK, a failure of any other kind, even a dead probe job -
  # leaves the agent job to run and surface the genuine failure itself.
  # The agent job is gated on the output, so a quota skip shows as a skipped
  # (grey) check, and the post job comments "not run: quota" and warns.
  quota-probe:
    needs: resolve
    # Same gates as the agent job's resolve half: a fork PR or a skipped resolve
    # (a draft, a text-only edit) never reaches the model at all.
    if: ${{ needs.resolve.result == 'success' && needs.resolve.outputs.same_repo == 'true' }}
    uses: ./.github/workflows/agent-quota-probe.yml
    with:
      model: ${{ vars.PREMORTEM_MODEL || 'opencode/inkling-2-small-free' }}
      variant: ${{ vars.PREMORTEM_VARIANT || 'max' }}
      opencode-version: "2.2.7"
    secrets:
      ACTIONS_NVIDIA_API_KEY: ${{ secrets.ACTIONS_NVIDIA_API_KEY }}

  premortem:
    needs: [resolve, quota-probe]
    # Fork PRs are not pre-mortemed, and a skipped resolve (a draft) skips this
    # job with it. The probe's `available` output is the quota gate: only a
    # positive "the model is capped" skips the agent - a probe that failed, was
    # skipped or never ran leaves `available` empty, which is not 'false', so the
    # agent job still runs and a genuine failure still fails. `!cancelled()`
    # keeps the expression from implying `success()`, which would skip the agent
    # on a failed probe - the fail-open case above.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.same_repo == 'true' && needs.quota-probe.outputs.available != 'false' }}
    runs-on: ubuntu-latest
    # The skill stops starting new scenarios at about 20 minutes of work.
    timeout-minutes: 30
    permissions:
      contents: read
      # The pending mark below is this job's only write.
      statuses: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      quota: ${{ steps.run.outputs.quota }}
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      BASE_SHA: ${{ needs.resolve.outputs.base }}
      HEAD_SHA: ${{ needs.resolve.outputs.head }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The analysed commit is marked `pending` here, not in resolve: a run the
      # quota probe skips never reaches this job, so it leaves no `pending`
      # status behind - the "not run: quota" path is genuinely neutral. Written
      # first so the mark covers the whole agent run, checkout included.
      - name: Mark running
        run: |
          # The one status whose description names no analysed pair: there is no result yet, so it
          # links the run that is computing it instead (see the header).
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending -f context="$PREMORTEM_CONTEXT" -f description="Running" \
            -f target_url="$RUN_URL" > /dev/null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-pre-mortem-meta
          path: ${{ runner.temp }}/premortem

      - name: Install opencode
        run: bash scripts/agents/install_opencode.sh

      # Rules: the base branch's skill if it has one. Otherwise (only while the
      # skill is not merged yet) the PR's own copy.
      - name: Select skill revision
        run: bash scripts/agents/select_skill.sh premortem "pre-mortem skill"

      # The agent lives in the global config, not in the checkout. Its system
      # prompt is the skill body (the skill's own frontmatter is dropped). It is
      # read-only; .env reads stay denied.
      - name: Configure pre-mortem agent
        run: bash scripts/agents/configure_agent.sh premortem

      - name: Run pre-mortem agent
        id: run
        env:
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
          NVIDIA_API_KEY: ${{ startsWith(env.MODEL, 'nvidia/') && secrets.ACTIONS_NVIDIA_API_KEY || '' }}
        run: bash scripts/agents/run_agent.sh premortem

      # A separate step, so the verdict reaches $GITHUB_OUTPUT from a file the
      # agent never had this step's env file to append to. A quota skip wrote no
      # verdict - the agent step's `quota` output is what the post job reads
      # instead, so an empty verdict is never mapped to `error`.
      - name: Read verdict
        id: verdict
        if: steps.run.outputs.quota != 'true'
        run: |
          set -euo pipefail
          echo "verdict=$(cat "$RUNNER_TEMP/premortem/verdict.txt")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-pre-mortem
          # The posted comment, and the agent's raw stdout beside it. The comment is the tail of
          # that stream, so a run whose report lost its opening sections is only diagnosable
          # against what the stream actually carried - and the stream is not in the log, which
          # carries the bounded 4000-byte echo of a failed run's output instead.
          path: |
            ${{ runner.temp }}/premortem/comment.md
            ${{ runner.temp }}/premortem/comment.md.raw
          retention-days: 14

  # Posts the comment and sets the status. Also reports a
  # failed run (an infra failure, e.g. the free model's usage limit) as `error`,
  # and a quota skip - the probe's or the agent step's - as "not run: quota",
  # which is never `error` and never a verdict `success`.
  post:
    needs: [resolve, premortem, quota-probe]
    # Runs for a finished agent job (success or failure), and for the quota skip
    # the probe produced: the agent job is then `skipped`, which is exactly the
    # grey check the decision asks for, and this job is what still tells the PR
    # why. `!cancelled()` keeps the expression from implying `success()`, so a
    # failed agent job still reaches the reporters below.
    if: ${{ !cancelled() && (needs.premortem.result == 'success' || needs.premortem.result == 'failure' || (needs.resolve.outputs.same_repo == 'true' && needs.quota-probe.outputs.available == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Verified on PR #178 for the review workflow's identical steps:
    # pull-requests: write is enough for the issues/{n}/comments endpoints on a
    # pull request; issues: write is not needed. contents: read is for the
    # checkout the shared posting script needs.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      HEAD_SHA: ${{ needs.resolve.outputs.head }}
      BASE_SHA: ${{ needs.resolve.outputs.base }}
      VERDICT: ${{ needs.premortem.outputs.verdict }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report failed pre-mortem run
        if: needs.premortem.result == 'failure'
        run: |
          set -euo pipefail
          # Pending only, as every other reporter here, and only when this run wrote
          # that pending mark: another run of this same commit - the documented
          # side-by-side dispatch of an older commit, or a rerun of this one - may
          # already have written its final status, and an infra failure of this run
          # must not replace it. The commit status API has no conditional write, so
          # what it allows is pinned down instead: the *newest* status of the context
          # (the API's own ordering is not documented, hence the sort by creation time
          # rather than `[0]`) and the run that wrote it, so only this run's own
          # `pending` mark is converted. Both reads are `gh api --paginate ... | jq -sr
          # --arg ...`: `gh api` itself has no `--arg`, and a status list is one page per
          # 30 entries, so the mark to convert is not guaranteed to be on the page the
          # API returns first. The target URL is compared for equality, since
          # `.../runs/123` is a prefix of `.../runs/1234`. The read-then-write window between them
          # cannot be closed by this API, so this is best effort, not an atomic
          # conversion.
          status=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
            | jq -sr --arg ctx "$PREMORTEM_CONTEXT" --arg url "$RUN_URL" \
              '[.[].statuses[] | select(.context == $ctx)] | sort_by(.created_at) | last as $s | ($s.state // "unset") + "|" + ((($s.target_url // "") == $url) | tostring)')
          state=${status%%|*}
          owner=${status#*|}
          pair=""
          if [ -n "$BASE_SHA" ]; then pair=" on base ${BASE_SHA:0:8}"; fi
          if [ "$state" = "pending" ] && [ "$owner" = "true" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=error -f context="$PREMORTEM_CONTEXT" \
              -f description="Pre-mortem run failed for ${HEAD_SHA:0:8}${pair}; see the run log" \
              -f target_url="$RUN_URL" > /dev/null
          else
            # A terminal status (a verdict of its own, or an earlier error) stands;
            # say so instead of leaving the run silent about what it did not do.
            echo "::notice::agent/pre-mortem on ${HEAD_SHA} is '${state}', not this run's pending mark; this failed run did not replace it."
          fi

      # The probe-skip path has no agent artifact: the agent job never ran, so
      # the "not run: quota" comment is written here instead. The mid-run quota
      # path already wrote the same body into the artifact, so this step is the
      # probe path's alone.
      - name: Write quota comment
        if: needs.quota-probe.outputs.available == 'false'
        run: python3 scripts/agents/quota_comment.py --stage premortem --when probe > comment.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.premortem.result == 'success'
        with:
          name: agent-pre-mortem

      # One comment per PR, identified by a hidden marker and updated in place.
      # Uses the REST API only, through the shared post_comment.py: a result
      # for a commit that is no longer the PR head does not overwrite the
      # comment, and a "not run: quota" body never overwrites a real verdict
      # for the same head.
      - name: Post or update pre-mortem comment
        if: needs.premortem.result == 'success' || needs.quota-probe.outputs.available == 'false'
        env:
          # True when the body being posted is the "not run: quota" report -
          # the probe path's or the mid-run path's - so the guard in
          # post_comment.py can keep it from overwriting a real verdict for
          # this same head.
          QUOTA_SKIP: ${{ needs.premortem.outputs.quota == 'true' || needs.quota-probe.outputs.available == 'false' }}
        run: python3 scripts/agents/post_comment.py --stage premortem --marker '<!-- actions-pre-mortem -->'

      - name: Set status
        if: needs.premortem.result == 'success' && needs.premortem.outputs.quota != 'true'
        run: |
          set -euo pipefail
          # Advisory, by decision of 2026-11-20: every verdict the agent can
          # produce is a `success` state, and the verdict is what the description
          # says. A BLOCK or CHANGES-REQUESTED pre-mortem is a ranked list of
          # scenarios with a sign-off note, not a mechanical gate - a `failure`
          # would fail the commit status of the very head a PR is asking to be
          # reviewed, blocking a merge over a judgement a human makes after
          # reading the comment. Only a run that could not produce a verdict at
          # all (INCOMPLETE, or the failed run reported above) is not a success.
          case "$VERDICT" in
            PASS|BLOCK|CHANGES-REQUESTED) state=success ;;
            *) state=error ;;
          esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" -f context="$PREMORTEM_CONTEXT" \
            -f description="Verdict: ${VERDICT} (advisory, see the comment) - head ${HEAD_SHA:0:8} on base ${BASE_SHA:0:8} - PR #${PR_NUMBER}" -f target_url="$RUN_URL" > /dev/null

      # A quota skip is not a verdict and not a failure: the commit status API
      # has no neutral state, so this run's own pending mark - when the agent
      # job wrote one before hitting the cap mid-run - is rewritten as `pending`
      # with the reason, which is the non-green, non-red answer the decision of
      # 2026-11-21 asks for. The probe-skip path wrote no mark at all (the agent
      # job never started), so the common outcome there is the notice. The same
      # identity-bearing read-then-write as the reporters: only this run's own
      # pending mark is touched, never another run's terminal status.
      - name: Report quota skip
        if: needs.premortem.outputs.quota == 'true' || (needs.resolve.outputs.same_repo == 'true' && needs.quota-probe.outputs.available == 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning::Pre-mortem not run: quota - the free model was capped, rate-limited or refused. Re-run the workflow after the quota resets."
          status=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
            | jq -sr --arg ctx "$PREMORTEM_CONTEXT" --arg url "$RUN_URL" \
              '[.[].statuses[] | select(.context == $ctx)] | sort_by(.created_at) | last as $s | ($s.state // "unset") + "|" + ((($s.target_url // "") == $url) | tostring)')
          state=${status%%|*}
          owner=${status#*|}
          pair=""
          if [ -n "$BASE_SHA" ]; then pair=" on base ${BASE_SHA:0:8}"; fi
          if [ "$state" = "pending" ] && [ "$owner" = "true" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=pending -f context="$PREMORTEM_CONTEXT" \
              -f description="Not run: quota - re-run after the quota resets - head ${HEAD_SHA:0:8}${pair} - PR #${PR_NUMBER}" \
              -f target_url="$RUN_URL" > /dev/null
          else
            # The probe path leaves no mark of this run's to rewrite (the agent
            # job never started), and another run's status is never this one's
            # to replace - say so instead of writing where nothing is owed.
            echo "::notice::agent/pre-mortem on ${HEAD_SHA} is '${state}', not this run's pending mark; the quota skip did not replace it."
          fi

      # A failure above (artifact download, comment POST/PATCH, status write)
      # would otherwise leave the status `pending` on this SHA forever. Only this
      # run's own pending mark is converted, so another run's terminal verdict
      # stands (as far as the API allows: see the reporter above).
      - name: Report post failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The same identity-bearing, best-effort conversion the other reporters make:
          # the newest status of the context, and only when this run wrote it.
          status=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
            | jq -sr --arg ctx "$PREMORTEM_CONTEXT" --arg url "$RUN_URL" \
              '[.[].statuses[] | select(.context == $ctx)] | sort_by(.created_at) | last as $s | ($s.state // "unset") + "|" + ((($s.target_url // "") == $url) | tostring)')
          state=${status%%|*}
          owner=${status#*|}
          pair=""
          if [ -n "$BASE_SHA" ]; then pair=" on base ${BASE_SHA:0:8}"; fi
          if [ "$state" = "pending" ] && [ "$owner" = "true" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=error -f context="$PREMORTEM_CONTEXT" \
              -f description="Post step failed for ${HEAD_SHA:0:8}${pair}; see the run log" \
              -f target_url="$RUN_URL" > /dev/null
          else
            echo "::notice::agent/pre-mortem on ${HEAD_SHA} is '${state}', not this run's pending mark; this failure did not replace it."
          fi

  # A cancelled run (a hand-cancel, or a superseding run through the
  # concurrency group) skips every reporter above, which would leave the status
  # `pending` with no signal. This job runs only on cancellation and turns this
  # run's own pending mark of the analysed commit into an error. What another run
  # wrote is not touched.
  report-cancelled:
    needs: [resolve, premortem, post]
    if: ${{ cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The commit the cancelled run analysed, with the resolve reporter's fallback chain
      # behind it: a job that is cancelled publishes no outputs, yet "Mark running"
      # inside it may already have written the `pending` mark this job exists to clear - so
      # an in-flight resolve leaves that mark stranded on its SHA with nothing but a
      # warning in a log nobody opens. The event's head (or the dispatch input) is what
      # keeps the mark clearable.
      HEAD_SHA: ${{ needs.resolve.outputs.head || github.event.pull_request.head.sha || inputs.head_sha }}
      # The base of the analysed pair, for the error description below; a cancelled job
      # publishes no outputs, so a cancelled resolve leaves it empty and the description
      # names the head alone.
      BASE_SHA: ${{ needs.resolve.outputs.base || github.event.pull_request.base.sha }}
      # A cancelled run publishes no outputs, so `needs.resolve.outputs.same_repo` is empty
      # exactly when the resolve job was the one cancelled - and an empty value is not "false":
      # reading it as such sent a fork run's head SHA to the commit-status API of a commit
      # this repository cannot read, and the reporter failed on the 404. The event's own head
      # repository is what keeps a cancelled same-repo run's mark clearable and a fork's run
      # clean.
      SAME_REPO: ${{ needs.resolve.outputs.same_repo || github.event.pull_request.head.repo.full_name == github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report cancelled pre-mortem run
        run: |
          set -euo pipefail
          # Fork PRs are never pre-mortemed: the resolve job guards its pending mark and the
          # agent job on the same `same_repo` output, and a fork's head commit is not one this
          # repository can write a status for - the read below would 404 on it. A cancelled run
          # publishes no outputs, so the value is derived from the event above; anything short
          # of a confirmed same-repo PR leaves the reporter alone rather than 404ing on a
          # commit this repository cannot read.
          #
          # Two things a cancelled `workflow_dispatch` cannot resolve, and this reporter does not
          # pretend otherwise. Its payload carries no `pull_request` at all, so
          # `github.event.pull_request.head.repo.full_name` is null and the comparison above is
          # false rather than a confirmation; and a dispatch that omitted `head_sha` names no
          # commit, while "Mark running" ran under the resolved one. A dispatch cancelled inside
          # resolve can therefore leave a `pending` mark this job cannot find: the only way to
          # find it is reading `pulls/N` by number, which needs a token scope this job does not
          # hold (it writes one status and nothing else), and widening a cancellation reporter's
          # scopes for a window of seconds is not a trade worth making. So the mark can strand,
          # and the log says that - it does not claim a fork ran, and it does not claim this run
          # marked nothing pending, because both are false in exactly the case that matters.
          if [ "$SAME_REPO" != "true" ]; then
            echo "::warning::Could not confirm from the event that this run's PR is in this repository; a pending mark, if this run wrote one, is left pending until a later run of that commit clears it."
            exit 0
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::warning::Resolve wrote no head SHA and the event named none; a pending mark, if this run wrote one, is left pending until a later run of that commit clears it."
            exit 0
          fi
          # A cancelled run is the case the identity check exists for: what cancelled it
          # is usually another run of the same commit, which then writes its own status.
          # The pending mark that is converted is this run's own - the newest status of
          # the context, and the one this run wrote - and the read-then-write window the
          # API cannot close is stated as best effort rather than denied.
          status=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
            | jq -sr --arg ctx "$PREMORTEM_CONTEXT" --arg url "$RUN_URL" \
              '[.[].statuses[] | select(.context == $ctx)] | sort_by(.created_at) | last as $s | ($s.state // "unset") + "|" + ((($s.target_url // "") == $url) | tostring)')
          state=${status%%|*}
          owner=${status#*|}
          pair=""
          if [ -n "$BASE_SHA" ]; then pair=" on base ${BASE_SHA:0:8}"; fi
          if [ "$state" = "pending" ] && [ "$owner" = "true" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=error -f context="$PREMORTEM_CONTEXT" \
              -f description="Pre-mortem run cancelled for ${HEAD_SHA:0:8}${pair}; re-dispatch to run it" \
              -f target_url="$RUN_URL" > /dev/null
          else
            echo "::notice::agent/pre-mortem on ${HEAD_SHA} is '${state}', not this run's pending mark; the cancellation did not replace it."
          fi
