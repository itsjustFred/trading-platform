name: Secret scan

# gitleaks over the commits a change introduces, never the whole history:
# pull_request scans base..head, push to main scans before..after. Findings
# fail the job; --redact keeps the secret itself out of the public log.
# Fixture false positives are handled by .gitleaks.toml (path + secret-shape
# pairs only). The binary is pinned by release version and verified against
# the published sha256, like the other pinned tooling in this repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan range needs the base/push-parent commits, not just HEAD.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          ./gitleaks git --redact
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          .
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # A ref creation has no 'before'; main cannot be re-created in
            # practice, so scan only the head commit rather than all history.
            echo "::warning::Push event has no 'before' SHA; scanning only the head commit."
            ./gitleaks git --redact --log-opts="-1 $AFTER" .
          else
            ./gitleaks git --redact --log-opts="$BEFORE..$AFTER" .
          fi
