name: PR review (advisory)

# Automated, read-only code review of every non-draft PR, using the
# `.agents/skills/actions-code-review` skill under the pi agent harness.
# The review is advisory: it posts (and on later pushes updates) one PR comment
# and never fails the PR because of its verdict.
#
# Review rules are read from the base branch (a PR cannot weaken its own
# review); fork PRs are skipped because they get no secrets.
#
# The model is reached through any OpenAI-compatible endpoint, declared in pi's
# models.json at run time (no pi extension needed).
#
# Configuration (Settings -> Secrets and variables -> Actions):
#   secret REVIEW_API_KEY    API key for the endpoint
#   var    REVIEW_PROVIDER   provider label (default: kilo)
#   var    REVIEW_BASE_URL   OpenAI-compatible base URL (default: Kilo gateway)
#   var    REVIEW_MODEL      model id (default: baidu/ernie-5.5-flash-preview:free)
#   var    REVIEW_THINKING   pi thinking level (default: high)
#   var    REVIEW_COMPAT     pi model "compat" JSON (default: Kilo/OpenRouter settings)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PI_VERSION: "1.5.2"
  PROVIDER: ${{ vars.REVIEW_PROVIDER || 'kilo' }}
  MODEL: ${{ vars.REVIEW_MODEL || 'baidu/ernie-5.5-flash-preview:free' }}
  SKILL_PATH: .agents/skills/actions-code-review/SKILL.md

jobs:
  review:
    # Fork PRs get no secrets, so they are skipped instead of failing.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only: the agent step gets no write token and no stored git credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pi
        run: npm install -g "@earendil-works/pi-coding-agent@${PI_VERSION}"

      # The key itself is not written anywhere: models.json references it as
      # $REVIEW_API_KEY, which pi resolves from the environment at request time.
      - name: Configure model endpoint
        env:
          BASE_URL: ${{ vars.REVIEW_BASE_URL || 'https://api.kilo.ai/api/gateway' }}
          COMPAT: ${{ vars.REVIEW_COMPAT || '{"supportsStore":false,"supportsDeveloperRole":false,"supportsReasoningEffort":false,"supportsUsageInStreaming":false,"supportsStrictMode":false,"thinkingFormat":"openrouter","maxTokensField":"max_tokens"}' }}
        run: |
          mkdir -p "$HOME/.pi/agent"
          jq -n --arg p "$PROVIDER" --arg u "$BASE_URL" --arg m "$MODEL" --argjson c "$COMPAT" \
            '{providers: {($p): {baseUrl: $u, api: "openai-completions", apiKey: "$REVIEW_API_KEY",
              models: [{id: $m, reasoning: true, contextWindow: 262144, maxTokens: 65536, compat: $c}]}}}' \
            > "$HOME/.pi/agent/models.json"

      # The reviewer's rules come from the base branch, so a PR cannot weaken the
      # review of itself. Only when the base has no skill yet (bootstrap) is the
      # PR's copy used, and the prompt says so.
      - name: Select skill revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/skill/actions-code-review"
          if git show "${BASE_SHA}:${SKILL_PATH}" > "$RUNNER_TEMP/skill/actions-code-review/SKILL.md" 2>/dev/null; then
            echo "SKILL_SOURCE=base branch" >> "$GITHUB_ENV"
          else
            cp "$SKILL_PATH" "$RUNNER_TEMP/skill/actions-code-review/SKILL.md"
            echo "SKILL_SOURCE=this PR (not on base yet)" >> "$GITHUB_ENV"
          fi

      # Title and body come from the event file, never from ${{ }} interpolation
      # into a shell script (script injection).
      - name: Write PR metadata
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          jq '{number: .pull_request.number, title: .pull_request.title, body: .pull_request.body,
               base: .pull_request.base.sha, head: .pull_request.head.sha}' \
            "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/review/meta.json"

      - name: Run review agent
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          THINKING: ${{ vars.REVIEW_THINKING || 'high' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/review/comment.md"
          pi -p --no-session --no-context-files --no-mcp --no-extensions \
            --tools read,grep,find,ls,bash \
            --skill "$RUNNER_TEMP/skill/actions-code-review" \
            --provider "$PROVIDER" --model "$MODEL" --thinking "$THINKING" \
            "/skill:actions-code-review Review PR #${PR_NUMBER}. Base ${BASE_SHA}, head ${HEAD_SHA}. PR metadata: $RUNNER_TEMP/review/meta.json. Reviewer: ${MODEL} via pi (${PROVIDER}). Review rules loaded from: ${SKILL_SOURCE}." \
            > "$out"
          # The verdict must be the last non-empty line (a verdict quoted from the
          # diff elsewhere in the output does not count).
          if ! grep -v '^[[:space:]]*$' "$out" | tail -n 1 | grep -q '^\*\*Verdict:'; then
            echo "::error::Review output does not end with a verdict line; not posting."
            cat "$out"
            exit 1
          fi
          # Never post anything that contains the API key (e.g. after prompt injection).
          if grep -qF -- "$REVIEW_API_KEY" "$out"; then
            echo "::error::Review output contains the API key; not posting."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ] || [ -n "$(git status --porcelain)" ]; then
            echo "::error::The review agent modified the checkout; not posting."
            git status --porcelain
            exit 1
          fi
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pr-review
          path: ${{ runner.temp }}/review/comment.md
          retention-days: 14

  post:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-review

      # One comment per PR, identified by a hidden marker and updated in place.
      # Uses the REST API only.
      - name: Post or update review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- actions-code-review -->'
          { echo "$marker"; cat comment.md; } > body.md
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@body.md > /dev/null
          fi
