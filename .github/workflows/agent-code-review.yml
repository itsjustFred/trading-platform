name: Agent Code Review

# Our own automated, read-only code review on every push to a PR, using the
# `.agents/skills/actions-code-review` skill as the system prompt of an
# opencode agent. Advisory only: it posts (and on later pushes updates) one PR
# comment and never fails the PR because of its verdict.
#
# opencode's free Zen models (and Kilo's, see Configuration) need no login and
# no API key, so this workflow holds no secret besides the default GITHUB_TOKEN
# (and, only for an `nvidia/...` model, ACTIONS_NVIDIA_API_KEY - see Configuration)
# of the posting job. Those
# models do cap usage, and an exhausted cap must not read as a review result:
# the shared `agent-quota-probe` workflow pings the same model before the agent
# job installs anything, and a cap, rate limit or region refusal there skips
# the agent job - a grey check, not a red one - while the post job comments
# "not run: quota" and warns (decision of 2026-11-21, issue #296). The probe's
# reply is logged on every path, its quota signature is grepped over stdout
# and stderr whatever the exit status (opencode has been seen exiting 0 on the
# cap for this tiny prompt), and `available=true` is only claimed when the
# reply actually carries the OK token - every other outcome fails open so a
# genuine failure still fails.
#
# The honest limit of the probe: it is a one-word ping, and a cap that is a
# token budget can still pass it - the ping fits under a ceiling the real run
# does not. Then the mid-run path below is the usual one: the agent step
# reports the skip instead of failing and the run's check is green (a job
# that ran cannot show skipped), with the comment saying "not run: quota".
# Grey is only reachable on the pre-install skip.
#
# A quota error that only appears mid-run takes the same path inside the
# agent step: the run reports the skip instead of failing. Anything the probe
# cannot classify as quota still runs the agent job, so a genuine failure - a
# broken install, a misconfigured model, a crashed agent - still fails the
# run.
#
# A run that failed for a transient reason other than quota (e.g. a provider
# outage) is restarted with "Re-run jobs" on the run page or
# `gh run rerun <run-id>`.
#
# Trust model:
# - The review rules (the skill) are read from the base branch, so a PR cannot
#   weaken its own review. Only while the base has no skill yet is the PR's copy
#   used, and the prompt says so.
# - The agent is defined in the runner's global opencode config, outside the
#   checkout. Its edit tool and .env reads are denied, but it has a shell, so
#   those denies are a hint, not a boundary. The real guards: the job holds no
#   token or secret, and the run fails if HEAD moved or the tree is dirty.
# - This workflow file itself is not pinned: on pull_request GitHub runs the
#   PR's copy. Accepted, since only collaborators with write access can open
#   same-repo PRs. Fork PRs and drafts are skipped - a draft is reviewed when
#   it is marked ready for review (`ready_for_review` is a trigger type).
#
# The step bodies live in `scripts/agents/` (install_opencode.sh,
# select_skill.sh, configure_agent.sh, run_agent.sh, quota_comment.py,
# post_comment.py, parse_verdict.py) so all three agent workflows share one
# tested copy; this file is only the stage-specific wiring.
#
# Configuration (Settings -> Secrets and variables -> Actions -> Variables):
#   REVIEW_MODEL    opencode model, provider/model (default: opencode/inkling-2-small-free)
#   REVIEW_VARIANT  reasoning variant offered by that model, e.g. low/high/max (default: max)
#
# A `kilo/<model>` value (e.g. kilo/reflection/beam-free) runs the stage on Kilo's
# anonymous gateway instead of Zen: no key either, but a separate quota. The config
# steps then enable opencode's built-in `kilo` provider. Kilo caps anonymous use per
# IP ("Sign up for free to continue") and rate-limits busy free models upstream
# (opencode retries those, then ends on "Provider returned error"); both take the
# quota path like a Zen cap. Kilo's free models may train on prompts - this
# repository is public. Variants are per model and not always the ones Kilo lists:
# opencode 2.2.7 refused Ling 3.2 Flash's `thinking` and took `high`.
#
# A `nvidia/<model>` value (e.g. nvidia/stepfun-ai/step-5-preview) runs the stage on
# NVIDIA's API with the ACTIONS_NVIDIA_API_KEY repository secret. Only the probe step
# and the agent step receive it, and only for an `nvidia/...` model; every other model
# runs with no secret, as before. The agent has a shell, so the key is reachable from
# the agent's environment: accepted for a free-tier key on same-repo PRs (forks are
# skipped and get no secrets). NVIDIA's free tier limits per key, not per IP, and the
# key is shared with local use. A 429 ("Too Many Requests") takes the quota path
# like a Zen cap - grey when the probe sees it, "not run: quota" when it hits mid-run.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: agent-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OPENCODE_VERSION: "2.2.7"
  MODEL: ${{ vars.REVIEW_MODEL || 'opencode/inkling-2-small-free' }}
  VARIANT: ${{ vars.REVIEW_VARIANT || 'max' }}
  SKILL_PATH: .agents/skills/actions-code-review/SKILL.md

jobs:
  # Resolves the PR from the event and writes its metadata (title and body
  # via jq, never via ${{ }} interpolation into a shell script).
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Drafts are not reviewed: the run resumes when the PR is marked ready for
    # review, one of the pull_request types above. A skipped resolve skips
    # every job that needs its outputs, so no quota is spent on a draft.
    if: ${{ github.event.pull_request.draft == false }}
    # Reads only the event payload; needs no token scope.
    permissions: {}
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      same_repo: ${{ steps.pr.outputs.same_repo }}
    steps:
      - name: Resolve PR
        id: pr
        run: |
          set -euo pipefail
          jq '.pull_request' "$GITHUB_EVENT_PATH" > pr.json
          jq '{number, title, body, base: .base.sha, head: .head.sha}' pr.json > meta.json
          {
            echo "number=$(jq -r .number pr.json)"
            echo "base=$(jq -r .base.sha pr.json)"
            echo "head=$(jq -r .head.sha pr.json)"
            echo "same_repo=$(jq -r --arg r "$GITHUB_REPOSITORY" '.head.repo.full_name == $r' pr.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-code-review-meta
          path: meta.json
          retention-days: 1

  # Cheap quota probe: one minimal model call on the configured model, before
  # the agent job installs anything. The probe itself is the shared reusable
  # workflow `.github/workflows/agent-quota-probe.yml` - one copy for all
  # three agent workflows. A positive quota/rate-limit/model-cap/
  # region-refusal signature means the agent job is skipped (grey), and the
  # post job reports "not run: quota". `available=true` is only claimed when
  # the reply carries the OK token; any other outcome - including the probe
  # itself failing - reports available=true so a real failure still fails.
  quota-probe:
    needs: resolve
    # Fork PRs are not reviewed, so they are not probed either.
    if: ${{ needs.resolve.result == 'success' && needs.resolve.outputs.same_repo == 'true' }}
    uses: ./.github/workflows/agent-quota-probe.yml
    with:
      model: ${{ vars.REVIEW_MODEL || 'opencode/inkling-2-small-free' }}
      variant: ${{ vars.REVIEW_VARIANT || 'max' }}
      opencode-version: "2.2.7"
    secrets:
      ACTIONS_NVIDIA_API_KEY: ${{ secrets.ACTIONS_NVIDIA_API_KEY }}

  review:
    needs: [resolve, quota-probe]
    # Fork PRs get no secrets on pull_request and are not reviewed. The probe's
    # `available` output is the quota gate: only a positive "the model is
    # capped" skips the agent - a probe that failed, was skipped or never ran
    # leaves `available` empty, which is not 'false', so the agent job still
    # runs and a genuine failure still fails. `!cancelled()` keeps the
    # expression from implying `success()`, which would skip the agent on a
    # failed probe - the fail-open case above.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.same_repo == 'true' && needs.quota-probe.outputs.available != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      quota: ${{ steps.run.outputs.quota }}
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      BASE_SHA: ${{ needs.resolve.outputs.base }}
      HEAD_SHA: ${{ needs.resolve.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      # The shared scripts run with the agent's secrets in reach, so they are
      # taken from the base branch when it has them - the same trust model as
      # the rules ("read from the base branch"). This consolidation's own runs
      # predate that: the base has no scripts/agents yet, so the head copy -
      # the change under test - is the fallback. Once this is on main every
      # PR's base has them and the head copy is never used.
      - name: Materialise trusted agent scripts
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/agent-scripts"
          mkdir -p "$dest"
          if git cat-file -e "${BASE_SHA}:scripts/agents/run_agent.sh" 2>/dev/null; then
            git archive "$BASE_SHA" scripts/agents | tar -x -C "$dest"
          else
            git archive HEAD scripts/agents | tar -x -C "$dest"
          fi
          echo "AGENT_SCRIPTS=$dest" >> "$GITHUB_ENV"

      - name: Install opencode
        run: bash "$AGENT_SCRIPTS/scripts/agents/install_opencode.sh"

      # Review rules: the base branch's skill if it has one. Otherwise (only
      # while the skill is not merged yet) the PR's own copy.
      - name: Select skill revision
        run: bash "$AGENT_SCRIPTS/scripts/agents/select_skill.sh" review "review skill"

      # The agent lives in the global config, not in the checkout. Its system
      # prompt is the skill body (the skill's own frontmatter is dropped).
      - name: Configure review agent
        run: bash "$AGENT_SCRIPTS/scripts/agents/configure_agent.sh" review

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-code-review-meta
          path: ${{ runner.temp }}/review

      - name: Run review agent
        id: run
        env:
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
          NVIDIA_API_KEY: ${{ startsWith(env.MODEL, 'nvidia/') && secrets.ACTIONS_NVIDIA_API_KEY || '' }}
        run: bash "$AGENT_SCRIPTS/scripts/agents/run_agent.sh" review

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-code-review
          path: ${{ runner.temp }}/review/comment.md
          retention-days: 14

  # Posts the comment. Also runs for the quota skip the probe produced: the
  # agent job is then `skipped` - the grey check the decision asks for - and
  # this job is what still tells the PR why. `!cancelled()` keeps the
  # expression from implying `success()`, so a quota skip still reaches the
  # comment steps below. The checkout is the PR head's (same-repo PRs only,
  # like the agent job): the posting logic is the shared, tested
  # scripts/agents/post_comment.py.
  post:
    needs: [resolve, review, quota-probe]
    if: ${{ !cancelled() && (needs.review.result == 'success' || (needs.resolve.outputs.same_repo == 'true' && needs.quota-probe.outputs.available == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Verified on PR #178: pull-requests: write is enough for the
    # issues/{n}/comments endpoints on a pull request; issues: write is not needed.
    # contents: read is for the checkout the shared posting script needs.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same trusted-copy rule as the agent job: the posting scripts run with
      # GH_TOKEN in reach, so they come from the base branch's copy when it
      # has one (this PR's own runs predate that and fall back to HEAD, the
      # merge ref this checkout already is).
      - name: Materialise trusted agent scripts
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/agent-scripts"
          mkdir -p "$dest"
          if git cat-file -e "${BASE_SHA}:scripts/agents/post_comment.py" 2>/dev/null; then
            git archive "$BASE_SHA" scripts/agents | tar -x -C "$dest"
          else
            git archive HEAD scripts/agents | tar -x -C "$dest"
          fi
          echo "AGENT_SCRIPTS=$dest" >> "$GITHUB_ENV"

      # The probe-skip path has no agent artifact: the agent job never ran, so
      # the "not run: quota" comment is written here instead. The mid-run quota
      # path already wrote the same body into the artifact, so this step is the
      # probe path's alone.
      - name: Write quota comment
        if: needs.quota-probe.outputs.available == 'false'
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
        run: |
          python3 "$AGENT_SCRIPTS/scripts/agents/quota_comment.py" --stage review --when probe > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.review.result == 'success'
        with:
          name: agent-code-review

      # One comment per PR, identified by a hidden marker and updated in place.
      # Uses the REST API only, through the shared post_comment.py: a result
      # for a commit that is no longer the PR head does not overwrite the
      # comment, and a "not run: quota" body never overwrites a real verdict
      # for the same head.
      - name: Post or update review comment
        if: needs.review.result == 'success' || needs.quota-probe.outputs.available == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.resolve.outputs.number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
          QUOTA_SKIP: ${{ needs.review.outputs.quota == 'true' || needs.quota-probe.outputs.available == 'false' }}
        run: python3 "$AGENT_SCRIPTS/scripts/agents/post_comment.py" --stage review --marker '<!-- actions-code-review -->'
