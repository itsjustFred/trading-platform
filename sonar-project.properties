sonar.projectKey=trading-platform-local
sonar.projectName=trading-platform-local

# Analyze the merged main branch state
sonar.sources=.
sonar.inclusions=**/*.py, **/*.ts, **/*.tsx, **/*.js, **/*.jsx
sonar.exclusions=\
  frontend/node_modules/**, \
  frontend/dist/**, \
  **/__pycache__/**, \
  **/.venv/**, \
  **/venv/**, \
  data/**, \
  artifacts/**, \
  logs/**, \
  reports/**, \
  parity-data/**, \
  graphify-out/**, \
  rndm_stuff/**, \
  ~/**, \
  100, \
  tests/**, \
  **/*.min.js, \
  **/*.lock

# Test code (kept disjoint from sonar.sources to avoid double indexing)
sonar.tests=tests

# Project language targets
sonar.python.version=3.12
