accounts:
  - id: alpaca-paper
    broker: alpaca
    broker_login: ${ALPACA_PAPER_ACCOUNT_REFERENCE}
  - id: ctrader-demo
    broker: ctrader
    ctid: ${CTRADER_DEMO_CTID}

deployments:
  - strategy_name: us_equities_momentum
    account_id: alpaca-paper
    symbols:
      - AAPL
      - MSFT
    timeframe: 1h
    status: PAUSED
    signal_source: internal
    signal_config: {}
    # Optional periodic broker reconciliation (#303). Broker state is
    # account-level, so the strictest settings across an account's deployments
    # win. Defaults are conservative; see docs/live-deploy-runbook.md.
    # A persistent mismatch halts ENTRIES only (exits/trailing keep running);
    # values are validated at creation.
    # settings:
    #   broker_reconciliation_interval_seconds: 300
    #   broker_reconciliation_qty_tolerance: null   # null = adapter precision
    #   broker_reconciliation_consecutive_mismatches: 2
    #   broker_reconciliation_enabled: true

  - strategy_name: fx_breakout
    account_id: ctrader-demo
    symbols:
      - EURUSD
      - XAUUSD
    timeframe: 15m
    status: PAUSED
    signal_source: discord
    signal_config:
      channel_id: ${DISCORD_BOT_FX_CHANNEL_ID}
      trusted_author_ids:
        - ${DISCORD_BOT_FX_AUTHOR_ID}
      wait_candle_close: true
      # A StockKit bot (Nitro / RamJet / RocketFuel on Alpaca) is marked
      # explicitly; an unknown route then fails closed at creation and dispatch:
      # stockkit_route: rocketfuel
