accounts:
  - id: alpaca-paper
    broker: alpaca
    broker_login: ${ALPACA_PAPER_ACCOUNT_REFERENCE}
  - id: ctrader-demo
    broker: ctrader
    ctid: ${CTRADER_DEMO_CTID}

deployments:
  - strategy_name: us_equities_momentum
    account_id: alpaca-paper
    symbols:
      - AAPL
      - MSFT
    timeframe: 1h
    status: PAUSED
    signal_source: internal
    signal_config: {}

  - strategy_name: fx_breakout
    account_id: ctrader-demo
    symbols:
      - EURUSD
      - XAUUSD
    timeframe: 15m
    status: PAUSED
    signal_source: discord
    signal_config:
      channel_id: ${DISCORD_BOT_FX_CHANNEL_ID}
      trusted_author_ids:
        - ${DISCORD_BOT_FX_AUTHOR_ID}
      wait_candle_close: true
