[project]
name = "trading-platform"
version = "0.1.0"
description = "Universal backtesting framework with multi-engine support and trade viewer"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.24",
    "openai>=2.11.0",
    "optuna>=4.0",
    "pydantic>=2.0",
    "plotly>=6.0",
    "aiohttp>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=16.0",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "discord.py>=2.4",
    "yfinance>=1.2.0",
    "alpaca-py>=0.43.2",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26"]
lean = ["lean>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.7.0",
    "pytest-xdist>=3.6.0",
    "pytest-json-report>=1.5.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.27.0",
    "ruff>=0.3",
]
all = ["trading-platform[vectorbt,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "runner", "viewer", "data_tools", "strategies", "risk", "signal_bots"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
