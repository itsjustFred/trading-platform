[project]
name = "trading-platform"
version = "0.1.0"
description = "Universal backtesting framework with multi-engine support and trade viewer"
requires-python = ">=3.12"
# B3: every floor carries a same-epoch ceiling (>=,<n+1) so a future
# breaking major can never slip in silently. Ceilings reflect the tested
# environment (pandas 3.x, pyarrow 25.x, websockets 17.x); bump deliberately.
# NOTE (CodeRabbit round): requests is held at 2.32.3 by
# ctrader-open-api==0.9.2 (exact pin; 0.9.3 yanked, no newer release), so
# CVE-2024-47081 (.netrc credential leak on cross-host redirect) cannot be
# fixed by bump yet. Disposition: the vulnerable path needs .netrc-stored
# credentials for the target host — this repo authenticates via headers/env
# files and never via .netrc, so the path is unreachable here. Revisit when
# ctrader-open-api relaxes its pin.
dependencies = [
    "pandas>=2.0,<4",
    "pyarrow>=15.0,<26",
    "numpy>=1.24,<3",
    "quantstats>=0.0.62,<1",
    "ipython>=9.0.0,<10",
    "requests>=2.32.3,<3",
    "openai>=2.11.0,<4",
    "optuna>=4.0,<5",
    "pydantic>=2.0,<3",
    "plotly>=6.0,<7",
    "openpyxl>=3.1,<4",
    "aiohttp>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "websockets>=16.0,<18",
    "sqlmodel>=0.0.22,<1",
    "sentry-sdk[fastapi]>=2.35.0,<3",
    "apscheduler>=3.10,<4",
    "discord.py>=2.4,<3",
    "yfinance>=1.2.0,<2",
    "alpaca-py>=0.43.2,<1",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "SQLAlchemy>=2.0,<3",
    "scipy>=1.12,<2",
    "starlette>=0.40,<2",
    "filelock>=3.16,<4",
    "tzdata>=2024.1,<2027",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26,<2"]
lean = ["lean>=1.0,<2"]
jforex = ["jpype1>=1.5.0,<2"]
pynecore = ["pynesys-pynecore[cli]>=0.1.0,<7"]
ctrader = [
    "ctrader-open-api>=0.9.2,<1",
    "twisted>=24.3.0,<25",
    "service-identity>=24.1.0,<25",
    "protobuf>=3.20,<7",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-playwright>=0.7.0,<1",
    "pytest-xdist>=3.6.0,<4",
    "pytest-json-report>=1.5.0,<2",
    "pytest-timeout>=2.3.1,<3",
    "httpx>=0.27.0,<1",
    "ruff>=0.3,<1",
]
all = ["trading-platform[vectorbt,lean,jforex,pynecore,ctrader,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "data_tools",
    "live_runner",
    "risk",
    "runner",
    "scheduler",
    "shared",
    "signal_bots",
    "strategies",
    "validation",
    "viewer",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
