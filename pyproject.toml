[project]
name = "trading-platform"
version = "0.1.0"
description = "Universal backtesting framework with multi-engine support and trade viewer"
requires-python = ">=3.12"
# B3: every floor carries a same-epoch ceiling (>=,<n+1) so a future
# breaking major can never slip in silently. Ceilings reflect the tested
# environment (pandas 3.x, pyarrow 25.x, websockets 17.x); bump deliberately.
dependencies = [
    "pandas>=2.0,<4",
    "pyarrow>=15.0,<26",
    "numpy>=1.24,<3",
    "quantstats>=0.0.62,<1",
    "ipython>=9.0.0,<10",
    "requests>=2.31.0,<3",
    "openai>=2.11.0,<4",
    "optuna>=4.0,<5",
    "pydantic>=2.0,<3",
    "plotly>=6.0,<7",
    "openpyxl>=3.1,<4",
    "aiohttp>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "websockets>=16.0,<18",
    "sqlmodel>=0.0.22,<1",
    "sentry-sdk[fastapi]>=2.35.0,<3",
    "apscheduler>=3.10,<4",
    "discord.py>=2.4,<3",
    "yfinance>=1.2.0,<2",
    "alpaca-py>=0.43.2,<1",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26,<2"]
lean = ["lean>=1.0,<2"]
jforex = ["jpype1>=1.5.0,<2"]
pynecore = ["pynesys-pynecore>=0.1.0,<7"]
ctrader = [
    "ctrader-open-api>=0.9.2,<1",
    "twisted>=24.3.0,<25",
    "service-identity>=24.1.0,<25",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-playwright>=0.7.0,<1",
    "pytest-xdist>=3.6.0,<4",
    "pytest-json-report>=1.5.0,<2",
    "pytest-timeout>=2.3.1,<3",
    "httpx>=0.27.0,<1",
    "ruff>=0.3,<1",
]
all = ["trading-platform[vectorbt,lean,jforex,pynecore,ctrader,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "runner", "viewer", "data_tools", "strategies", "risk", "signal_bots"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
