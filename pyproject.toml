[project]
name = "trading-platform"
version = "0.1.0"
description = "Universal backtesting framework with multi-engine support and trade viewer"
requires-python = ">=3.12"
# B3: every floor carries a same-epoch ceiling (>=,<n+1) so a future
# breaking major can never slip in silently. Ceilings reflect the tested
# environment (pandas 3.x, pyarrow 25.x, websockets 17.x); bump deliberately.
# NOTE (CodeRabbit round): requests is held at 2.32.3 by
# ctrader-open-api==0.9.2 (exact pin; 0.9.3 yanked, no newer release), so
# CVE-2024-47081 (.netrc credential leak on cross-host redirect) cannot be
# fixed by bump yet. Disposition: the vulnerable path needs .netrc-stored
# credentials for the target host — this repo authenticates via headers/env
# files and never via .netrc, so the path is unreachable here. Revisit when
# ctrader-open-api relaxes its pin.
dependencies = [
    "pandas>=2.0,<4",
    "pyarrow>=15.0,<26",
    "numpy>=1.24,<3",
    "quantstats>=0.0.62,<1",
    "ipython>=9.0.0,<10",
    "requests>=2.32.3,<3",
    "openai>=2.11.0,<4",
    "optuna>=4.0,<5",
    "pydantic>=2.0,<3",
    "plotly>=6.0,<7",
    "openpyxl>=3.1,<4",
    "aiohttp>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "websockets>=16.0,<18",
    "sqlmodel>=0.0.22,<1",
    "sentry-sdk[fastapi]>=2.35.0,<3",
    "apscheduler>=3.10,<4",
    "discord.py>=2.4,<3",
    "yfinance>=1.2.0,<2",
    "alpaca-py>=0.43.2,<1",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "SQLAlchemy>=2.0,<3",
    "scipy>=1.12,<2",
    "starlette>=0.40,<2",
    "filelock>=4.0,<5",
    "tzdata>=2024.1,<2027",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26,<2"]
lean = ["lean>=1.0,<2"]
jforex = ["jpype1>=1.5.0,<2"]
pynecore = ["pynesys-pynecore[cli]>=0.1.0,<7"]
ctrader = [
    "ctrader-open-api>=0.9.2,<1",
    "twisted>=24.3.0,<25",
    "service-identity>=24.1.0,<25",
    "protobuf>=3.20,<7",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-playwright>=0.7.0,<1",
    "pytest-xdist>=3.6.0,<4",
    "pytest-json-report>=1.5.0,<2",
    "pytest-timeout>=2.3.1,<3",
    "httpx>=0.27.0,<1",
    "ruff>=0.3,<1",
]
all = ["trading-platform[vectorbt,lean,jforex,pynecore,ctrader,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "data_tools",
    "live_runner",
    "risk",
    "runner",
    "scheduler",
    "shared",
    "signal_bots",
    "strategies",
    "validation",
    "viewer",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Not Python, or deliberately broken. These are inputs to other tools, not
# source we own:
#   tests/fixtures/sample_strategy.py is Pine Script (//@version=5, strategy()),
#   tests/fixtures/invalid_strategies/syntax_error.py is an explicit negative
#     control -- "deliberately unparseable" -- for the invalid-strategy path, so
#     repairing it would destroy the thing it exists to test.
#   strategy-comparisons/ holds QuantConnect algorithms, which the QC platform
#     requires to use `from AlgorithmImports import *`; rewriting that import
#     would break them on the platform.
extend-exclude = [
    "tests/fixtures",
    "strategy-comparisons",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "W",
    # Bug-class rules only (no style families, no mass reformat). Each family
    # enabled here was enabled only once every hit it produced had been fixed, so
    # adding to this list is never free: enable it, fix it, or document below why
    # it stays off.
    #
    # `B` in full, not a subset. The bugbear rules this repo already had (B006,
    # B008, B023, B904) plus the four that were firing and were fixed: B007 (an
    # unused loop index silently reads as "the index matters" at review time),
    # B009/B010 (`getattr`/`setattr` with a constant name, which is the
    # "dynamic lookup" without the dynamism - and a name a refactor cannot see),
    # and B905 (`zip()` that truncates the longer side instead of asserting the
    # two sequences are the same length).
    "B",
    # `DTZ` in full: naive datetimes. A trading platform cross-references a
    # broker's bar timestamps, a calendar's session dates and a UTC
    # order-submission deadline, so a naive `datetime.now()` on one side of a
    # comparison against an aware one is either a TypeError at the worst moment
    # or a silently mis-signed staleness verdict. DTZ901 is not excluded -
    # `datetime.min`/`max` used as a bound is exactly the same trap.
    "DTZ",
    # `PERF` in full: manual comprehension loops. Every hit here is the same
    # shape and is rewritten to the comprehension form, which is not a style
    # change but a difference between building an intermediate list and not.
    "PERF",
    "PLE",     # pylint errors (e.g. bare raise outside a handler)
    "PLW0120", # else on a loop that never breaks
    "PLW0602", # global declared but never assigned
    "PLW1510", # subprocess.run without explicit check=
    "RUF005",  # collection literal concatenation instead of unpacking
    "RUF006",  # fire-and-forget asyncio task that can be garbage collected
    "RUF007",  # zip() over a sequence and itself shifted by one, i.e. pairwise
    "RUF012",  # mutable class attribute default
    "RUF013",  # implicit Optional
    "RUF015",  # single-element slice as a first-element access
    "RUF019",  # `if key in dict:` guarding a plain dict access
    "RUF021",  # `and`/`or` chain without explicit parentheses
    "RUF023",  # unsorted `__slots__`
    "RUF036",  # `None` not last in a union
    "RUF043",  # `pytest.raises(match=...)` pattern with unescaped metacharacters
    "RUF046",  # `int()` around a value that is already an integer
    "RUF059",  # unpacked variable that is never used
    "S307",    # eval()
]

# Families NOT enabled, and why each stays off rather than being fixed:
#   UP   `datetime.timezone.utc` -> `datetime.UTC` is a 470-site pure rename whose
#        value is nil and whose diff cost is enormous; the DTZ family above already
#        forces the timezone question to be answered. UP042 (`str, Enum` ->
#        `StrEnum`) is a real behaviour change for serialised model fields.
#   SIM/PT Both are style/test-quality families, and PT011 (narrow
#        `pytest.raises` to the specific exception type) risks a test being
#        narrowed away rather than made honest.
#   PL   PLC0415 (import outside top level) and PLR2004 (magic value) fire
#        3,400+ times on code that is correct, which would turn the advisory
#        `ruff check .` step into noise nobody reads.
#   S    S101 alone fires 9,091 times, every one of it in tests, where the
#        assert IS the check.
#   RUF001-003 (ambiguous unicode), RUF022 (unsorted `__all__`), RUF100
#        (unused noqa) are set-dependent or cosmetic; RUF100 in particular
#        counts directives for rules that are not enabled, so its number would
#        change every time this block does.

# E402 is "module level import not at top of file", and every occurrence here is
# load-order the module genuinely depends on. None are accidental: these files
# cannot be reordered without changing behaviour, which is the only reason the
# rule exists.
#
#   strategies/*   STRATEGY_META is parsed from source with `ast` WITHOUT
#                  executing the module (shared/strategy_registry.py), so the
#                  metadata literal has to sit above the numpy/pynecore imports.
#                  Importing those first would make a metadata read cost a full
#                  dependency load, and would break the deliberate
#                  "parse without importing" property the registry depends on.
#   scripts/*      sys.path insertion before the project imports it enables,
#                  plus the import-origin guard that must run before the first
#                  `shared` import (tests/test_script_import_origin.py).
#   viewer/main.py dotenv load and env setup before the imports that read them.
#   signal_bots/   constant that the registry resolves before the processors.
#                  registry.py
#
# Moving any of these imports above its bootstrap is the exact bug the ordering
# prevents. Scoped per path rather than switched off: E402 still fires everywhere
# else, so a genuinely misplaced import in a new file is still an error.
[tool.ruff.lint.per-file-ignores]
"strategies/*" = ["E402"]
"scripts/*" = ["E402"]
"signal_bots/registry.py" = ["E402"]
"viewer/main.py" = ["E402"]
# pynecore strategies declare inputs as `src = input.source(...)` default
# arguments; that call IS the framework's declaration API and must run at
# definition time, so B008 is a false positive there.
"strategies/pynecore_*/*" = ["B008"]
# Test doubles: class-level mutable attributes are per-test fixtures that are
# never shared across instances in a way that matters, and test subprocesses
# are asserted on via returncode/output rather than check=True.
"tests/*" = ["RUF012", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Scope is deliberately narrow: the packages whose type errors can become a
# wrong order. Widen by adding paths here, not by loosening the flags.
files = ["risk", "live_runner", "shared/models.py", "shared/market_calendar.py", "signal_bots", "strategies"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
# Imported-but-unchecked modules are followed so signatures resolve, but their
# own errors are not reported (they are outside `files`).
follow_imports = "silent"
