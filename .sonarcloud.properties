# Automatic-analysis configuration (limited key subset).
# The reference-parity ports under strategies/ref_*/ and
# scripts/reference_parity/ are deliberate independent reimplementations of
# the reference libraries: their similarity to the originals (and to each
# other, for the long/short bracket pair) IS the artifact under test, so
# copy-paste detection is excluded for them only. Every other rule still runs.
sonar.cpd.exclusions=strategies/ref_bracket_long/**,strategies/ref_bracket_short/**,strategies/ref_sma_cross_all_in/**,scripts/reference_parity/**
