[pytest]
testpaths = tests
# pytest-randomly is installed with the dev extra for the weekly
# randomised-tests workflow; keep every other pytest run in declared order.
addopts = -p no:randomly
markers =
    e2e: End-to-end tests that require browser automation.
    integration: Integration tests against running services.
    unit: Fast, isolated unit tests.
    slow: Long-running tests.
    ai_code: AI-generated code quality and validation tests.
timeout = 180
base_url = http://localhost:5556
